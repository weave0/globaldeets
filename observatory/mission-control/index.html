<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GlobalDeets Mission Control: what the GFD web estate is, whether it works, whether anyone uses it, and what deserves attention first, with the evidence behind every claim.">
  <title>Mission Control | GlobalDeets</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/shared/ecosystem-nav.css">
  <link rel="stylesheet" href="/observatory/mission-control/mission-control.css">
</head>
<body data-mission-control-ready="false" data-view="executive">
  <div id="ecosystem-nav"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <main class="shell" id="main">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">GlobalDeets</p>
        <h1>Mission Control</h1>
        <p class="sub" id="as-of" aria-live="polite"></p>
      </div>
      <div class="actions no-print">
        <div class="view-switch" role="tablist" aria-label="Choose a view" id="tabs">
          <button type="button" role="tab" id="tab-executive" aria-controls="view-executive" aria-selected="true">Executive</button>
          <button type="button" role="tab" id="tab-operator" aria-controls="view-operator" aria-selected="false" tabindex="-1">Operator</button>
        </div>
        <button type="button" class="btn" id="copy-summary">Copy summary</button>
        <button type="button" class="btn" id="print-view">Print / PDF</button>
        <span class="sr-only" id="copy-status" role="status" aria-live="polite"></span>
      </div>
    </header>

    <div id="evidence-banner" class="banners" role="status" hidden></div>
    <p id="loading" class="loading">Loading governed evidence…</p>
    <noscript><p class="banner tone-banner-bad">Mission Control needs JavaScript to render governed evidence. The raw JSON is linked at the bottom of the page.</p></noscript>

    <section id="view-executive" role="tabpanel" aria-labelledby="tab-executive" hidden></section>
    <section id="view-operator" role="tabpanel" aria-labelledby="tab-operator" hidden></section>

    <div id="mission-control-error" class="error-panel" role="alert" hidden>Mission Control data could not be validated and has been withheld.</div>
    <p class="footer-links no-print"><a href="/observatory/mission-control/executive.json">Executive JSON</a> · <a href="/observatory/mission-control/estate-health.json">Estate health JSON</a> · <a href="/observatory/mission-control/audience.json">Audience JSON</a> · <a href="/observatory/mission-control/business-events.json">Business events JSON</a> · <a href="/observatory/mission-control/diagnostics.json">Diagnostics JSON</a> · <a href="/observatory/mission-control/history.json">History JSON</a> · <a href="/observatory/mission-control/probes.json">Probes JSON</a></p>
  </main>
  <script src="/shared/ecosystem-nav.js"></script>
  <script src="/observatory/mission-control/evidence-semantics.js"></script>
  <script src="/observatory/mission-control/mc-model.js"></script>
  <script src="/observatory/mission-control/mc-charts.js"></script>
  <script src="/observatory/mission-control/mc-executive.js"></script>
  <script src="/observatory/mission-control/mc-operator.js"></script>
  <script src="/observatory/mission-control/mission-control.js"></script>
</body>
</html>
