name: GD-040 publisher diversity preview
on:
  push:
    branches:
      - feat/gd040-source-diverse-desk

permissions:
  contents: read

concurrency:
  group: gd040-diversity-preview
  cancel-in-progress: true

jobs:
  diversity-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Governed Function contracts
        run: npm run test:functions
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npx playwright test
      - name: Stage source-specific Pages artifact
        run: npm run stage:deploy
        env:
          NODE_ENV: production
          CF_PAGES_BRANCH: gd040-diversity-preview
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy isolated preview (not production)
        uses: cloudflare/wrangler-action@v4
        id: preview
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name globaldeets --branch gd040-diversity-preview --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Verify hosted selection contract and screenshot
        run: node tools/verify-diversity-preview.js --base="$PREVIEW_URL" --expected-commit="$EXACT_SHA"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          EXACT_SHA: ${{ github.sha }}
      - name: Preserve browser screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gd040-home-selection-preview
          path: design-previews/gd040-home.png
          if-no-files-found: ignore
          retention-days: 14
