name: Production boundary response diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/boundary-diagnostics.yml'
      - 'tools/verify-boundary-retired-prod.js'
      - 'tests/boundary-response-diagnostics.test.mjs'
  workflow_dispatch:
    inputs:
      immutable_base:
        description: Immutable Cloudflare Pages deployment URL to compare
        required: false
        default: https://69a0a63f.globaldeets.pages.dev

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fingerprint boundary responses without deploying
        env:
          GLOBALDEETS_BOUNDARY_IMMUTABLE_BASE: ${{ inputs.immutable_base || 'https://69a0a63f.globaldeets.pages.dev' }}
        run: node tools/verify-boundary-retired-prod.js --diagnose

      - name: Run production boundary acceptance check without deploying
        run: node tools/verify-boundary-retired-prod.js
