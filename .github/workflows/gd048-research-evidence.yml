name: GD-048 research-only feed evidence (no-cost)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gd048-research-evidence.yml'
      - 'tools/source-research-probe.mjs'
      - 'tools/source-origin-signals.mjs'

permissions:
  contents: read

concurrency:
  group: gd048-research-evidence
  cancel-in-progress: true

jobs:
  inspect-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GD048_RESULT: /tmp/gd048.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Collect bounded research observations (no production writes)
        run: |
          node tools/source-research-probe.mjs --all > "$GD048_RESULT"
          test -s "$GD048_RESULT"
      - name: Publish honest technical evidence in job summary and logs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync(process.env.GD048_RESULT, 'utf8'));
          if (run.inventoryBeforeAndAfter !== 21) throw new Error('source inventory invariant failed');
          if (!Array.isArray(run.results) || run.results.length !== 7) throw new Error('unexpected candidate registry size');
          const rows = run.results.map(result => {
            if (result.productionEligible !== false || result.itemReuseRightsCertified !== false || result.registryDisposition !== 'research')
              throw new Error('research-to-production status drift');
            const evidence = result.evidence || {};
            if (result.evidence) {
              const hints = evidence.sourceHintCounts;
              if (!hints || !['publisher-source-hint','external-source-hint','conflicting-source-hints','unresolved'].every(
                key => Number.isInteger(hints[key]) && hints[key] >= 0
              )) throw new Error('source hint counts are missing or invalid');
              const hintSum = Object.values(hints).reduce((total, count) => total + count, 0);
              if (hintSum !== evidence.sampledItems || evidence.autoAdmittableItems !== 0 ||
                evidence.itemOriginCertified !== false || evidence.itemReuseRightsCertified !== false ||
                evidence.itemsRequiringIndividualProvenanceReview !== evidence.sampledItems)
                throw new Error('article provenance or auto-admission invariant failed');
            }
            return '| ' + [result.candidateId, result.httpStatus ?? '—',
              result.observation, evidence.sampledItems ?? '—',
              evidence.newestSampleAgeHours ?? '—',
              evidence.duplicateCanonicalLinks ?? '—',
              evidence.creatorSignals ?? '—',
              evidence.attributionLinkPairs ?? '—',
              evidence.offPublisherHostLinks ?? '—',
              evidence.sourceHintCounts?.['publisher-source-hint'] ?? '—',
              evidence.sourceHintCounts?.['external-source-hint'] ?? '—',
              evidence.sourceHintCounts?.['conflicting-source-hints'] ?? '—',
              evidence.sourceHintCounts?.unresolved ?? '—',
              evidence.itemsRequiringIndividualProvenanceReview ?? '—'].join(' | ') + ' |';
          });
          const summary = [
            '# GD-048: live feed *research* observations',
            '',
            'This is a technical spot check, **not** proof of permission, item provenance, editorial independence, freshness SLA or production admission.',
            'No sources were activated, no article content was retained, and licensing cannot be inferred from HTTP success.',
            'CDATA may contain bylines; all source-host categories are metadata hints only, never findings of original reporting or licensed reuse.',
            '',
            '| Candidate | HTTP | Observation | Sampled items | Newest age (hours) | Duplicate links | Author signals | Author + URL pairs | Off-publisher-host URLs | Publisher source hints | External/partner-host hints | Conflicts | Unresolved | Items still requiring review |',
            '| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |',
            ...rows,
            '',
            'Failures and redirects require follow-up; even successful XML observation retains the research-only gate.',
            '',
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(JSON.stringify({probeVersion:run.probeVersion,sourceInventory:run.inventoryBeforeAndAfter,results:run.results}, null, 2));
          NODE
