name: Deploy to Cloudflare Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: pages-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install Playwright Chromium
              run: npx playwright install chromium

            - name: Validate before deploy
              run: |
                  npm run lint
                  npm run test:smoke

            - name: Fetch validated Mission Control evidence (if any)
              run: |
                  if git ls-remote --exit-code --heads origin mission-control-evidence >/dev/null 2>&1; then
                    git fetch --depth=1 origin mission-control-evidence
                    git worktree add --detach .evidence FETCH_HEAD
                  else
                    echo "::warning::No mission-control-evidence branch yet; deploying the committed seed data plane."
                  fi

            - name: Stage clean deploy artifact
              run: npm run stage:deploy
              env:
                  NODE_ENV: production
                  CF_PAGES_BRANCH: main
                  CF_PAGES_COMMIT_SHA: ${{ github.sha }}
                  MISSION_CONTROL_EVIDENCE_DIR: .evidence

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4.131.1"
                  command: pages deploy dist --project-name globaldeets --branch main --commit-hash ${{ github.sha }} --commit-dirty=false

            - name: Verify production deployment
              env:
                  EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if npm run health:prod -- --skip-active-copy --expected-commit="${EXPECTED_COMMIT}" --deploy-meta-max-age-hours=1; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Production did not converge to a healthy state after all verification attempts."
                      exit 1
                    fi

                    echo "Production verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done

            - name: Verify production intelligence APIs
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if node tools/verify-intelligence-prod.js --base=https://globaldeets.com; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Production intelligence APIs did not converge after all verification attempts."
                      exit 1
                    fi

                    echo "Intelligence verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done

            - name: Verify production coverage observatory
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if node tools/verify-observatory-prod.js --base=https://globaldeets.com; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Coverage & Evidence Observatory did not converge after all verification attempts."
                      exit 1
                    fi

                    echo "Observatory verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done

            - name: Verify rendered production reader
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if node tools/verify-reader-prod.js --base=https://globaldeets.com; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Rendered production reader did not converge after all verification attempts."
                      exit 1
                    fi

                    echo "Rendered reader verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done

            - name: Verify secondary mobile production surfaces
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if node tools/verify-secondary-mobile-prod.js --base=https://globaldeets.com; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Secondary mobile surfaces did not converge after all verification attempts."
                      exit 1
                    fi

                    echo "Secondary mobile verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done

            - name: Verify Mission Control data plane
              run: |
                  expected_at=""
                  if [ -f .evidence/latest/estate-health.json ]; then
                    expected_at=$(node -p "require('./.evidence/latest/estate-health.json').generatedAt || ''")
                  fi
                  for attempt in 1 2 3 4 5 6; do
                    if node tools/verify-mission-control-prod.js --base=https://globaldeets.com --min-generated-at="${expected_at}"; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Mission Control data plane did not converge after all verification attempts."
                      exit 1
                    fi

                    echo "Mission Control verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done
