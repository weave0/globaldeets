name: Deploy to Cloudflare Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: pages-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Install Playwright Chromium
              run: npx playwright install chromium

            - name: Validate before deploy
              run: |
                  npm run lint
                  npm run test:smoke

            - name: Stage clean deploy artifact
              run: npm run stage:deploy
              env:
                  NODE_ENV: production
                  CF_PAGES_BRANCH: main
                  CF_PAGES_COMMIT_SHA: ${{ github.sha }}

            - name: Deploy to Cloudflare Pages
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4"
                  command: pages deploy dist --project-name globaldeets --branch main --commit-hash ${{ github.sha }} --commit-dirty=false

            - name: Verify production deployment
              env:
                  EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  for attempt in 1 2 3 4 5 6; do
                    if npm run health:prod -- --skip-active-copy --expected-commit="${EXPECTED_COMMIT}" --deploy-meta-max-age-hours=1; then
                      exit 0
                    fi

                    if [ "${attempt}" -eq 6 ]; then
                      echo "Production did not converge to a healthy state after all verification attempts."
                      exit 1
                    fi

                    echo "Production verification attempt ${attempt} failed; retrying after propagation delay."
                    sleep 10
                  done
