name: GD-042 selection accountability preview
on:
  push:
    branches:
      - feat/gd042-selection-accountability

permissions:
  contents: read

concurrency:
  group: gd042-selection-accountability
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Governed Function and intelligence tests
        run: npm run test:functions
      - run: npx playwright install --with-deps chromium
      - name: Browser, mobile and service worker regressions
        run: npx playwright test
      - name: Stage exact-commit artifact
        run: npm run stage:deploy
        env:
          NODE_ENV: production
          CF_PAGES_BRANCH: gd042-selection-preview
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy isolated Pages selection preview
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name globaldeets --branch gd042-selection-preview --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Inspect exact hosted response against displayed audit
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.deployment-url }}
          EXACT_SHA: ${{ github.sha }}
        run: node tools/verify-selection-preview.js --base="$PREVIEW_URL" --expected-commit="$EXACT_SHA"
      - name: Archive audited desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gd042-selection-accountability
          path: design-previews/gd042-*.png
          if-no-files-found: ignore
          retention-days: 14
