name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f index.html     || (echo "MISSING: index.html" && exit 1)
          test -f _headers       || (echo "MISSING: _headers" && exit 1)
          test -f dossiers/santa-ynez-pipeline/index.html || (echo "MISSING: Santa Ynez dossier" && exit 1)
          test -f observatory/coverage/index.html || (echo "MISSING: Coverage & Evidence Observatory" && exit 1)
          test -f observatory/mission-control/history.json || (echo "MISSING: Mission Control history" && exit 1)
          test -f observatory/mission-control/estate-health.json || (echo "MISSING: Mission Control estate health" && exit 1)
          test -f observatory/mission-control/diagnostics.json || (echo "MISSING: Mission Control diagnostics" && exit 1)
          test -f observatory/mission-control/probes.json || (echo "MISSING: Mission Control probes" && exit 1)
          test -f observatory/mission-control/audience.json || (echo "MISSING: Mission Control audience" && exit 1)
          test -f observatory/mission-control/business-events.json || (echo "MISSING: Mission Control business events" && exit 1)
          test -f observatory/mission-control/executive.json || (echo "MISSING: Mission Control executive summary" && exit 1)
          test -f observatory/mission-control/evidence-semantics.js || (echo "MISSING: Mission Control evidence semantics" && exit 1)
          test -f tools/mission-control/config/estate-registry.json || (echo "MISSING: estate registry" && exit 1)
          test -f .github/workflows/mission-control-evidence.yml || (echo "MISSING: scheduled evidence workflow" && exit 1)
          echo "All required files present."

      - name: Verify GA4 tag present
        run: |
          grep -q "G-WM6Q66W9W0" index.html || (echo "MISSING: GA4 tag" && exit 1)

      - name: Verify HSTS header present
        run: |
          grep -q "Strict-Transport-Security" _headers || (echo "MISSING: HSTS in _headers" && exit 1)

      - name: Verify error monitoring present
        run: |
          grep -q "window.onerror" index.html || (echo "MISSING: window.onerror" && exit 1)

      - name: JavaScript syntax check
        run: |
          node --check build-metadata.js
          node --check health-prod.js
          node --check tools/stage-deploy.js
          node --check tools/deploy-pages.js
          node --check tools/verify-intelligence-prod.js
          node --check tools/verify-observatory-prod.js
          node --check functions/api/deploy.js
          node --check functions/api/news/health.js
          node --check functions/api/news/coverage.js
          node --check functions/api/news/sources.js
          node --check functions/api/news/admission.js
          node --check functions/api/intelligence/schema.js
          node --check functions/api/intelligence/evidence-schema.js
          node --check functions/api/intelligence/acquisition/eurostat-density.js
          node --check functions/api/intelligence/dossiers/santa-ynez-pipeline.js
          node --check functions/api/intelligence/observatory/coverage.js
          node --check functions/lib/news-coverage.js
          node --check functions/lib/news-source-provenance.js
          node --check functions/lib/news-source-admission.js
          node --check functions/lib/local-reporting-observatory.js
          node --check functions/lib/intelligence-model.js
          node --check functions/lib/m49-place-seed.js
          node --check functions/lib/claim-evidence-model.js
          node --check functions/lib/institutional-evidence-sources.js
          node --check functions/lib/institutional-evidence-acquisition.js
          node --check functions/lib/dossier-integrity.js
          node --check functions/lib/santa-ynez-dossier.js
          node --check functions/lib/coverage-evidence-observatory.js
          node --check dossiers/santa-ynez-pipeline/dossier.js
          node --check observatory/coverage/observatory.js
          node --check observatory/mission-control/mission-control.js
          node --check observatory/mission-control/evidence-semantics.js
          node --check observatory/mission-control/mc-model.js
          node --check observatory/mission-control/mc-charts.js
          node --check observatory/mission-control/mc-executive.js
          node --check observatory/mission-control/mc-operator.js
          node --check tools/verify-mission-control-prod.js
          node --check tools/mission-control/collect.mjs
          node --check tools/mission-control/build.mjs
          node --check tools/mission-control/probe-vantage.mjs
          node --check tools/mission-control/overlay.mjs
          node --check tools/mission-control/lib/probe.mjs
          node --check tools/mission-control/lib/estate.mjs
          node --check tools/mission-control/lib/diagnostics.mjs
          node --check tools/mission-control/lib/ledger.mjs
          node --check tools/mission-control/lib/gold.mjs
          node --check tools/mission-control/lib/plane.mjs
          node --check tools/mission-control/lib/contracts.mjs
          node --check tools/mission-control/lib/evidence.mjs
          node --check tools/mission-control/lib/collect.mjs
          node --check tools/mission-control/lib/cloudflare-inventory.mjs
          node --check tools/mission-control/lib/instrumentation.mjs
          node --check tools/mission-control/lib/rum-reception.mjs
          node --check tools/mission-control/lib/readings.mjs
          node --check tools/mission-control/lib/audience.mjs
          node --check tools/mission-control/lib/events.mjs
          node --check tools/mission-control/lib/vantage.mjs
          node --check tools/mission-control/lib/executive.mjs
          node --check shared/ecosystem-nav.js
          node --check playwright.config.js
          node --check tests/smoke.spec.js
          node --check tests/observatory-smoke.spec.js
          node --check tests/news-source-admission.test.mjs
          node --check tests/news-source-admission-hardening.test.mjs
          node --check tests/news-admission-api.test.mjs
          node --check tests/intelligence-model.test.mjs
          node --check tests/claim-evidence-model.test.mjs
          node --check tests/institutional-evidence-acquisition.test.mjs
          node --check tests/santa-ynez-dossier.test.mjs
          node --check tests/coverage-evidence-observatory.test.mjs
          node --check tests/local-reporting-observatory.test.mjs
          node --check tests/mission-control-data.test.mjs
          node --check tests/mission-control-smoke.spec.js
          node --check tests/mission-control-probe.test.mjs
          node --check tests/mission-control-collector.test.mjs
          node --check tests/mission-control-evidence.test.mjs
          node --check tests/mission-control-scheduler.test.mjs
          node --check tests/mission-control-hardening.test.mjs
          node --check tests/mission-control-audience.test.mjs
          node --check tests/mission-control-events.test.mjs
          node --check tests/mission-control-instrumentation.test.mjs
          node --check tests/mission-control-vantage.test.mjs
          node --check tests/mission-control-intelligence.test.mjs
          node --check tests/mission-control-executive.test.mjs
          node --check tests/mission-control-migration.test.mjs
          node --check tests/mission-control-model.test.mjs
      - name: Reject stale investor-facing copy
        run: |
          if grep -qi "Data Platform Showcase" categories.html; then echo "STALE: portfolio-era categories copy" && exit 1; fi


      - name: Mission Control seed data plane matches the deterministic build
        run: node tools/mission-control/build.mjs --check

      - name: Reject unsourced Mission Control health claims
        run: |
          if grep -rniE "availability: *'?healthy|status: *'?up'" observatory/mission-control/mission-control.js; then echo "STALE: hard-coded health claim in Mission Control UI" && exit 1; fi
          if grep -qE "No estate-wide production availability probe is connected|Availability and critical-path state remain unknown until probes are connected" observatory/mission-control/mission-control.js observatory/mission-control/index.html; then echo "STALE: GD-029 placeholder copy" && exit 1; fi

      - name: Lint JavaScript
        run: npm run lint

      - name: Run Function contract tests
        run: npm run test:functions

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Stage deploy artifact
        run: npm run stage:deploy
