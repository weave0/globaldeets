name: GD-043 saved reading preview
on:
  push:
    branches:
      - feat/gd043-local-saved-story

permissions:
  contents: read

concurrency:
  group: gd043-saved-reading-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Governed Functions and evidence contracts
        run: npm run test:functions
      - run: npx playwright install --with-deps chromium
      - name: Browser, mobile, rights and service worker regressions
        run: npx playwright test
      - name: Stage exact reviewed candidate
        run: npm run stage:deploy
        env:
          NODE_ENV: production
          CF_PAGES_BRANCH: gd043-saved-reading-preview
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      - name: Deploy isolated preview
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name globaldeets --branch gd043-saved-reading-preview --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Verify first-party saved story and real hosted offline revisit
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.deployment-url }}
          EXACT_SHA: ${{ github.sha }}
        run: node tools/verify-saved-reading-preview.js --base="$PREVIEW_URL" --expected-commit="$EXACT_SHA"
      - name: Save design and return-navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gd043-saved-reading-previews
          path: design-previews/gd043-*.png
          if-no-files-found: ignore
          retention-days: 14
